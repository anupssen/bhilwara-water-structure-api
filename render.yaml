services:
  - type: web
    name: bhilwara-water-structure-api
    env: python
    # Free instance (512 MB RAM; the API peaks at ~200 MB). It sleeps after
    # 15 idle minutes, so the first request after that takes ~30-60 s.
    plan: free
    # Closest Render region to Rajasthan.
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Frontend origin(s) allowed by CORS, comma-separated.
      # Example: https://bhilwara-water-structure-website.onrender.com
      - key: CORS_ORIGINS
        sync: false